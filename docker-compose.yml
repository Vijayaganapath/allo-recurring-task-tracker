services:
  mysql:
    image: mysql:8.0
    container_name: allo_mysql
    restart: always
    environment:
      TZ: Asia/Kolkata
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - allo-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DB_USER} -p${DB_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mailpit:
    image: axllent/mailpit:latest
    container_name: allo_mailpit
    restart: always
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${SMTP_PORT}:1025"
    networks:
      - allo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allo_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      TZ: Asia/Kolkata
      PORT: 5000
      NODE_ENV: ${NODE_ENV}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TEST_DB_NAME: ${TEST_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      SCHEDULER_CRON: ${SCHEDULER_CRON}
      SLA_L0_REMINDER_HOURS_BEFORE: ${SLA_L0_REMINDER_HOURS_BEFORE}
      SLA_L1_MANAGER_ALERT_HOURS_AFTER: ${SLA_L1_MANAGER_ALERT_HOURS_AFTER}
      SLA_L2_MANAGER_RECHECK_HOURS_AFTER: ${SLA_L2_MANAGER_RECHECK_HOURS_AFTER}
      SLA_L3_LEADERSHIP_HOURS_AFTER: ${SLA_L3_LEADERSHIP_HOURS_AFTER}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - allo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allo_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - allo-network

volumes:
  db_data:

networks:
  allo-network:
    driver: bridge
